<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrasi Akun Si Jete | Kominfotik Jakarta Timur</title>
    <link rel="icon" href="assets/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="styling/register.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="assets/js/popup-notify.js"></script>
  </head>

  <body>
    <div class="background-animation">
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <div class="register-container">
      <div class="brand-header">
        <img src="assets/Karakter1.png" alt="Logo Si Jete" class="logo" />
        <h1>Daftar Akun</h1>
        <p class="tagline">Chatbot Resmi Kominfotik Jakarta Timur</p>
      </div>

      <form id="registerForm" class="register-form">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
          />
        </div>

        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
          />
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
          <i
            class="fas fa-eye toggle-password"
            onclick="togglePassword('password')"
          ></i>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="confirm"
            name="confirm"
            placeholder="Konfirmasi Password"
            required
          />
          <i
            class="fas fa-eye toggle-password"
            onclick="togglePassword('confirm')"
          ></i>
        </div>

        <div class="password-requirements">
          <p>Password harus mengandung:</p>
          <ul>
            <li id="length">Minimal 8 karakter</li>
            <li id="uppercase">Huruf besar (A-Z)</li>
            <li id="lowercase">Huruf kecil (a-z)</li>
            <li id="number">Angka (0-9)</li>
            <li id="symbol">Simbol (!@#$%^&*)</li>
          </ul>
        </div>

        <button type="submit" class="register-btn">
          <span>Daftar Sekarang</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="footer-links">
        <p>Sudah punya akun? <a href="user.html">Login di sini</a></p>
      </div>
    </div>

    <script>
      const form = document.getElementById("registerForm");

      // Pastikan elemen password ada sebelum menambahkan event listener
      const passwordInput = document.getElementById("password");
      if (passwordInput) {
        passwordInput.addEventListener("input", function (e) {
          validatePasswordStrength(e.target.value);
        });
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (!/^[a-zA-Z0-9]+$/.test(username)) {
          PopupNotify.info(
            "Username hanya boleh huruf dan angka, tanpa spasi atau simbol."
          );
          document.getElementById("username").focus();
          return;
        }

        if (!email) {
          PopupNotify.info("Email wajib diisi.");
          document.getElementById("email").focus();
          return;
        }

        if (!validatePassword(password)) {
          PopupNotify.info(
            "Password harus memenuhi semua persyaratan keamanan."
          );
          document.getElementById("password").focus();
          return;
        }

        if (password !== confirm) {
          PopupNotify.info("Konfirmasi password tidak cocok.");
          document.getElementById("confirm").focus();
          return;
        }

        try {
          const response = await fetch("/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            PopupNotify.success(
              "Registrasi berhasil!",
              "Mengalihkan ke halaman login..."
            );
            setTimeout(() => {
              window.location.href = "user.html";
            }, 2000);
          } else {
            PopupNotify.failed(data.error || "Gagal melakukan registrasi");
          }
        } catch (err) {
          PopupNotify.failed("Terjadi kesalahan jaringan");
        }
      });

      function validatePassword(password) {
        const lengthCheck = password.length >= 8;
        const upperCheck = /[A-Z]/.test(password);
        const lowerCheck = /[a-z]/.test(password);
        const numberCheck = /[0-9]/.test(password);
        const symbolCheck = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        return (
          lengthCheck && upperCheck && lowerCheck && numberCheck && symbolCheck
        );
      }

      function validatePasswordStrength(password) {
        // Fungsi ini akan mengubah tampilan visual dari elemen li di .password-requirements
        document
          .getElementById("length")
          .classList.toggle("valid", password.length >= 8);
        document
          .getElementById("uppercase")
          .classList.toggle("valid", /[A-Z]/.test(password));
        document
          .getElementById("lowercase")
          .classList.toggle("valid", /[a-z]/.test(password));
        document
          .getElementById("number")
          .classList.toggle("valid", /[0-9]/.test(password));
        document
          .getElementById("symbol")
          .classList.toggle("valid", /[!@#$%^&*(),.?":{}|<>]/.test(password));
      }

      function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = document.querySelector(
          `[onclick="togglePassword('${fieldId}')"]`
        );

        if (field.type === "password") {
          field.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          field.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        document.querySelector(".register-container").classList.add("loaded");
      });
    </script>
  </body>
</html>
