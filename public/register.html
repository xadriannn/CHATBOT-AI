<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Akun Si Jete | Kominfotik Jakarta Timur</title>
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="styling/register.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="background-animation">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="register-container">
    <div class="brand-header">
      <img src="assets/Karakter1.png" alt="Logo Si Jete" class="logo">
      <h1>Daftar Akun</h1>
      <p class="tagline">Chatbot Resmi Kominfotik Jakarta Timur</p>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <form id="registerForm" class="register-form">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" name="username" placeholder="Username" required />
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Password" required />
        <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="confirm" name="confirm" placeholder="Konfirmasi Password" required />
        <i class="fas fa-eye toggle-password" onclick="togglePassword('confirm')"></i>
      </div>

      <div class="password-requirements">
        <p>Password harus mengandung:</p>
        <ul>
          <li id="length">Minimal 8 karakter</li>
          <li id="uppercase">Huruf besar (A-Z)</li>
          <li id="lowercase">Huruf kecil (a-z)</li>
          <li id="number">Angka (0-9)</li>
          <li id="symbol">Simbol (!@#$%^&*)</li>
        </ul>
      </div>

      <button type="submit" class="register-btn">
        <span>Daftar Sekarang</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="footer-links">
      <p>Sudah punya akun? <a href="user.html">Login di sini</a></p>
    </div>
  </div>

  <script>
  const form = document.getElementById("registerForm");
  const alertBox = document.getElementById("alertBox");

  // Validasi kekuatan password secara real-time
  document.getElementById("password").addEventListener("input", function(e) {
    validatePasswordStrength(e.target.value);
  });

  form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    // Validasi username: hanya huruf dan angka, tanpa spasi/simbol
    if (!/^[a-zA-Z0-9]+$/.test(username)) {
      showAlert("Username hanya boleh huruf dan angka, tanpa spasi atau simbol.");
      document.getElementById("username").focus();
      return;
    }

    // Validasi password sesuai standar
    if (!validatePassword(password)) {
      showAlert("Password harus minimal 8 karakter, mengandung huruf besar, huruf kecil, angka, dan simbol.");
      document.getElementById("password").focus();
      return;
    }

    // Validasi konfirmasi password
    if (password !== confirm) {
      showAlert("Konfirmasi password tidak cocok.");
      document.getElementById("confirm").focus();
      return;
    }

    try {

      // Kirim waktu pembuatan user dengan zona Asia/Bangkok (GMT+7)
      const nowBangkok = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Bangkok' }));
      const created_at = nowBangkok.toISOString();

      const response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, created_at })
      });
      
      const data = await response.json();
      
      if (response.ok) {
        showAlert("Registrasi berhasil!", "success");
        setTimeout(() => {
          window.location.href = 'user.html'; // atau login.html
        }, 2000);
      } else {
        showAlert(data.error || "Gagal melakukan registrasi");
      }
    } catch (err) {
      showAlert("Terjadi kesalahan jaringan");
    }
  });

  function validatePassword(password) {
    const lengthCheck = password.length >= 8;
    const upperCheck = /[A-Z]/.test(password);
    const lowerCheck = /[a-z]/.test(password);
    const numberCheck = /[0-9]/.test(password);
    const symbolCheck = /[!@#$%^&*(),.?":{}|<>]/.test(password);

    return lengthCheck && upperCheck && lowerCheck && numberCheck && symbolCheck;
  }

  function validatePasswordStrength(password) {
    document.getElementById("length").classList.toggle("valid", password.length >= 8);
    document.getElementById("uppercase").classList.toggle("valid", /[A-Z]/.test(password));
    document.getElementById("lowercase").classList.toggle("valid", /[a-z]/.test(password));
    document.getElementById("number").classList.toggle("valid", /[0-9]/.test(password));
    document.getElementById("symbol").classList.toggle("valid", /[!@#$%^&*(),.?":{}|<>]/.test(password));
  }

  function resetPasswordValidation() {
    document.querySelectorAll(".password-requirements li").forEach(li => {
      li.classList.remove("valid");
    });
  }

  function showAlert(message, type = "error") {
    alertBox.style.display = "block";
    alertBox.textContent = message;
    alertBox.className = "alert-box " + type;
    
    if (type === "success") {
      setTimeout(() => {
        alertBox.style.display = "none";
      }, 3000);
    }
  }

  function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const icon = document.querySelector(`[onclick="togglePassword('${fieldId}')"]`);
    
    if (field.type === "password") {
      field.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      field.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  }

  // Animasi saat halaman dimuat
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelector(".register-container").classList.add("loaded");
  });
  </script>
</body>
</html>
