<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="google-signin-client_id" content="1025050418446-9m2l6m51tijp2b0ksd8di1qjtgf4hpmo.apps.googleusercontent.com">
  <title>Login Si Jete | Chatbot Kominfotik Jakarta Timur</title>
  <link rel="stylesheet" href="styling/user.css">
  <link rel="icon" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="background-animation">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="login-container">
    <div class="brand-header">
      <img src="assets/Karakter1.png" alt="Logo Si Jete" class="logo">
      <h1>Si Jete</h1>
      <p class="tagline">Chatbot Resmi Kominfotik Jakarta Timur</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" name="username" placeholder="Username" required>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
      </div>

      <button type="submit" class="login-btn">
        <span>Masuk</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="divider">
      <span>atau lanjutkan dengan</span>
    </div>

    <div class="social-login">
      <div id="g_id_onload"
           data-client_id="1025050418446-9m2l6m51tijp2b0ksd8di1qjtgf4hpmo.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>

      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="filled_blue"
           data-text="continue_with"
           data-size="large"
           data-logo_alignment="left">
      </div>
    </div>

   <div class="footer-links">
  <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
  <a href="lupapw.html" class="forgot-password" title="Lupa password">Lupa password?</a>
</div>
  </div>

  <div id="float-alert" class="float-alert hidden">
  <span id="float-alert-text"></span>
</div>

  <script src="https://apis.google.com/js/platform.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <script>
    function handleCredentialResponse(response) {
      const jwt = response.credential;
      const payload = JSON.parse(atob(jwt.split('.')[1]));
      console.log("User Google:", payload);
      sessionStorage.setItem("userGoogle", JSON.stringify(payload));
      window.location.href = "index.html";
    }

    function togglePassword() {
      const passwordField = document.getElementById('password');
      const icon = document.querySelector('.toggle-password');
      
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordField.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Animasi saat halaman dimuat
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.login-container').classList.add('loaded');
    });
  </script>

  <script>
  function showFloatAlert(message, type = "error") {
    const alertBox = document.getElementById("float-alert");
    const alertText = document.getElementById("float-alert-text");

    alertText.textContent = message;
    alertBox.classList.remove("show", "success");
    alertBox.classList.add("show");

    if (type === "success") {
      alertBox.style.backgroundColor = "#52c41a";
    } else {
      alertBox.style.backgroundColor = "#ff4d4f";
    }

    setTimeout(() => {
      alertBox.classList.remove("show");
    }, 3000);
  }
</script>


</body>
</html>
