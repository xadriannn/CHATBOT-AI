<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profil - Si Jete</title>
    <link rel="icon" href="/assets/logo.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styling/form-style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="/assets/js/popup-notify.js"></script>
  </head>
  <body>
    <div class="background-animation">
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <div class="register-container" id="form-container-main">
      <header class="brand-header">
        <img src="/assets/Karakter1.png" alt="Logo" class="logo" />
        <h1>Edit Profil Anda</h1>
        <p class="tagline">Perbarui informasi akun Anda di bawah ini</p>
      </header>

      <form id="edit-profile-form" class="register-form" novalidate>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
          />
        </div>

        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
          />
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="new-password"
            name="new-password"
            placeholder="Password Baru (Opsional)"
          />
          <i
            class="fas fa-eye-slash toggle-password"
            id="toggle-password-1"
          ></i>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Konfirmasi Password Baru"
          />
          <i
            class="fas fa-eye-slash toggle-password"
            id="toggle-password-2"
          ></i>
        </div>

        <button type="submit" class="register-btn">
          <i class="fas fa-save"></i>
          Simpan Perubahan
        </button>
      </form>

      <div class="footer-links">
        <p><a href="/chat">Kembali ke Halaman Chat</a></p>
      </div>
    </div>

    <script src="/edit-profile.js"></script>
    <script>
      // Efek animasi saat halaman dimuat
      window.addEventListener("load", () => {
        document.getElementById("form-container-main").classList.add("loaded");
      });

      // Logika untuk toggle lihat/sembunyikan password
      document.querySelectorAll(".toggle-password").forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const input = toggle.previousElementSibling;
          if (input.type === "password") {
            input.type = "text";
            toggle.classList.remove("fa-eye-slash");
            toggle.classList.add("fa-eye");
          } else {
            input.type = "password";
            toggle.classList.remove("fa-eye");
            toggle.classList.add("fa-eye-slash");
          }
        });
      });
    </script>
  </body>
</html>
