<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png" type="image/x-icon">
</head>

<style>
  /* Login & Dashboard Admin */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body, html {
  width: 100%;
  height: 100%;
}

/* --- Login Page --- */
.login-body {
  background: linear-gradient(to right, #ffffff, #e0dfdf);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

.login-container {
  background: white;
  padding: 2rem 3rem;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.login-container h2 {
  margin-bottom: 1.5rem;
  color: #333;
}

.login-container input {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 1rem;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.login-container button {
  width: 100%;
  padding: 0.75rem;
  border: none;
  background: #1d2671;
  color: white;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.login-container button:hover {
  background: #0f185b;
}

/* --- Dashboard --- */
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f4f7fc;
    color: #333;
  }
  .sidebar {
    position: fixed;
    height: 100vh;
    width: 250px;
    background: #1e293b;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 2rem 1rem;
  }
  .sidebar h2 {
    font-weight: 700;
    margin-bottom: 2rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .nav-link {
    padding: 12px 1rem;
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 500;
    border-radius: 6px;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    transition: background-color 0.3s ease, color 0.3s ease;
    cursor: pointer;
  }
  .nav-link:hover,
  .nav-link.active {
    background-color: #334155;
    color: #f8fafc;
  }
  .nav-link svg {
    margin-right: 10px;
    fill: currentColor;
    width: 18px;
    height: 18px;
  }
  main {
    margin-left: 250px;
    padding: 2rem 3rem;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2.5rem;
  }
  header h1 {
    font-weight: 700;
    font-size: 1.8rem;
    color: #1e293b;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 2rem;
    margin-bottom: 3rem;
  }
  .stat-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgb(149 157 165 / 0.2);
    padding: 1.8rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .stat-card .stat-title {
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 1px;
  }
  .stat-card .stat-value {
    font-size: 2.8rem;
    font-weight: 700;
    color: #2563eb;
    margin-top: 0.3rem;
  }
  .chart-container {
    background: #fff;
    border-radius: 14px;
    padding: 2rem;
    box-shadow: 0 8px 24px rgb(149 157 165 / 0.2);
  }
  footer {
    text-align: center;
    margin-top: 4rem;
    color: #94a3b8;
    font-size: 0.9rem;
  }
  /* Responsive */
  @media (max-width: 768px) {
    .sidebar {
      position: relative;
      width: 100%;
      height: auto;
      flex-direction: row;
      padding: 1rem 2rem;
      justify-content: center;
    }
    .sidebar h2 {
      display: none;
    }
    .nav-link {
      margin: 0 0.8rem;
      padding: 0.5rem 0.8rem;
    }
    main {
      margin: 0;
      padding: 1.5rem 1rem;
    }
    .stats {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.2rem;
    }
  }
</style>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <h2>Login Admin</h2>
      <form>
        <input type="text" placeholder="Username" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Masuk</button>
      </form>
    </div>
  </div>
</body>
</html>
