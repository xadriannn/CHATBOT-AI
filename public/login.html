<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-signin-client_id"
      content="1025050418446-9m2l6m51tijp2b0ksd8di1qjtgf4hpmo.apps.googleusercontent.com"
    />
    <title>Login Si Jete | Chatbot Kominfotik Jakarta Timur</title>
    <link rel="stylesheet" href="styling/user.css" />
    <link rel="icon" href="assets/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="background-animation">
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <div class="login-container">
      <div class="brand-header">
        <img src="assets/Karakter1.png" alt="Logo Si Jete" class="logo" />
        <h1>Si Jete</h1>
        <p class="tagline">Chatbot Resmi Kominfotik Jakarta Timur</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input
            type="text"
            id="loginIdentifier"
            name="loginIdentifier"
            placeholder="Username atau Email"
            required
            autocomplete="username"
          />
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password"
          />
          <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
        </div>
        <button type="submit" class="login-btn">
          <span>Masuk</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="divider">
        <span>atau lanjutkan dengan</span>
      </div>

      <div class="social-login">
        <div
          id="g_id_onload"
          data-client_id="1025050418446-9m2l6m51tijp2b0ksd8di1qjtgf4hpmo.apps.googleusercontent.com"
          data-context="signin"
          data-ux_mode="popup"
          data-callback="handleCredentialResponse"
          data-auto_prompt="false"
        ></div>
        <div
          class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="filled_blue"
          data-text="continue_with"
          data-size="large"
          data-logo_alignment="left"
        ></div>
      </div>

      <div class="footer-links">
        <p>Belum punya akun? <a href="/register">Daftar sekarang</a></p>
        <a href="/change-password" class="forgot-password" title="Lupa password"
          >Lupa password?</a
        >
      </div>
    </div>

    <script src="assets/js/popup-notify.js"></script>

    <script>
      function isValidEmail(email) {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return regex.test(email);
      }

      function togglePassword() {
        const passwordField = document.getElementById("password");
        const icon = document.querySelector(".toggle-password");
        if (passwordField.type === "password") {
          passwordField.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          passwordField.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      // Fungsi ini juga bisa diakses global oleh Google API
      async function handleCredentialResponse(response) {
        const jwt = response.credential;
        const payload = JSON.parse(atob(jwt.split(".")[1]));

        try {
          const serverResponse = await fetch("/login-google", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            credentials: "include",
          });
          const data = await serverResponse.json();

          if (data.success) {
            // DIUBAH: Gunakan PopupNotify.success
            PopupNotify.success(
              "Login dengan Google berhasil!",
              "Selamat Datang!"
            );
            setTimeout(() => {
              window.location.href = data.redirect || "index.html";
            }, 1500);
          } else {
            // DIUBAH: Gunakan PopupNotify.failed
            PopupNotify.failed(data.error || "Login dengan Google gagal.");
          }
        } catch (err) {
          // DIUBAH: Gunakan PopupNotify.failed
          PopupNotify.failed("Terjadi kesalahan jaringan.");
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        document.querySelector(".login-container").classList.add("loaded");

        document
          .getElementById("loginForm")
          .addEventListener("submit", async function (e) {
            e.preventDefault();
            const loginIdentifier = document
              .getElementById("loginIdentifier")
              .value.trim();
            const password = document.getElementById("password").value;

            if (!loginIdentifier) {
              PopupNotify.info("Username atau Email harus diisi!");
              return;
            }

            if (
              loginIdentifier.includes("@") &&
              !isValidEmail(loginIdentifier)
            ) {
              PopupNotify.info("Format email yang Anda masukkan tidak valid!");
              return;
            }
            if (!password) {
              PopupNotify.info("Password harus diisi!");
              return; // Hentikan proses jika kosong
            }

            try {
              const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ loginIdentifier, password }),
              });
              const data = await response.json();

              if (response.ok && data.success) {
                PopupNotify.success("Login berhasil!", "Selamat Datang!");
                setTimeout(() => {
                  // DIUBAH: Arahkan ke /chat sesuai endpoint baru
                  window.location.href = data.redirect || "/chat";
                }, 1500);
              } else {
                PopupNotify.failed(
                  data.error || "Username/email atau password salah"
                );
              }
            } catch (err) {
              PopupNotify.failed("Terjadi kesalahan jaringan");
            }
          });
      });
    </script>
  </body>
</html>
