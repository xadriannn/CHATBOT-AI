<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Si Jete</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styling/login.css" />
    <link rel="icon" href="assets/logo.png" type="image/x-icon" />
  </head>

  <body class="login-body">
    <div class="background-animation">
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <div class="login-container">
      <div class="login-card">
        <div class="brand-header">
          <img src="assets/Karakter1.png" alt="Logo Si Jete" class="logo" />
          <h1>Si Jete</h1>
          <p class="tagline">Admin Dashboard</p>
        </div>

        <!-- <div id="alertBox" class="alert-box">
        <i class="fas fa-exclamation-circle"></i>
        <span>Username atau password salah</span>
      </div> -->

        <form id="loginForm" action="/login" method="POST" class="login-form">
          <div class="input-group">
            <i class="fas fa-user"></i>
            <input
              type="text"
              name="username"
              placeholder="Username"
              required
            />
          </div>

          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Password"
              required
            />
            <i
              class="fas fa-eye toggle-password"
              onclick="togglePassword()"
            ></i>
          </div>

          <button type="submit" class="login-btn">
            <span>Masuk</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </form>
      </div>
    </div>

    <script src="assets/js/popup-notify.js"></script>

    <script>
      // Fungsi ini kita taruh di luar agar bisa diakses oleh `onclick` di HTML
      function togglePassword() {
        const passwordField = document.getElementById("password");
        const icon = document.querySelector(".toggle-password");
        if (passwordField.type === "password") {
          passwordField.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          passwordField.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      // Gunakan satu DOMContentLoaded untuk semua logika
      document.addEventListener("DOMContentLoaded", () => {
        // 1. Jalankan animasi saat halaman dimuat
        document.querySelector(".login-container").classList.add("loaded");

        // 2. Siapkan form login
        const loginForm = document.getElementById("loginForm");

        if (loginForm) {
          loginForm.addEventListener("submit", async (event) => {
            // Mencegah form mengirim dengan cara biasa (mencegah reload)
            event.preventDefault();

            const formData = new FormData(loginForm);
            const data = Object.fromEntries(formData.entries());

            // Simpan username untuk ditampilkan jika login berhasil nanti
            localStorage.setItem("adminName", data.username);

            try {
              // Kirim data login menggunakan JavaScript
              const response = await fetch("/login", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(data),
              });

              const result = await response.json();

              // Tampilkan notifikasi berdasarkan respons dari server
              if (response.ok) {
                PopupNotify.success(
                  result.message || "Anda berhasil login!",
                  "Selamat Datang!"
                );
                setTimeout(() => {
                  window.location.href = "/dashboard"; // Arahkan ke halaman utama
                }, 1500);
              } else {
                PopupNotify.failed(
                  result.message || "Username atau password salah."
                );
              }
            } catch (error) {
              console.error("Error:", error);
              PopupNotify.failed("Terjadi kesalahan pada koneksi.");
            }
          });
        }
      });
    </script>
  </body>
</html>
