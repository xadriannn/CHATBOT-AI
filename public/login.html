<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Si Jete</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styling/login.css">
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
</head>

<body class="login-body">
  <div class="background-animation">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <img src="assets/Karakter1.png" alt="Logo Si Jete" class="logo">
        <h1>Si Jete</h1>
        <p class="tagline">Admin Dashboard</p>
      </div>

      <div id="alertBox" class="alert-box">
        <i class="fas fa-exclamation-circle"></i>
        <span>Username atau password salah</span>
      </div>

      <form id="loginForm" action="/login" method="POST" class="login-form">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" name="username" placeholder="Username" required />
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" id="password" placeholder="Password" required />
          <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
        </div>

        <button type="submit" class="login-btn">
          <span>Masuk</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Simpan username ke localStorage sebelum login
    document.addEventListener('DOMContentLoaded', () => {
      // Sembunyikan alert box awalnya
      document.getElementById('alertBox').style.display = 'none';
      
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', () => {
        const usernameInput = form.querySelector('input[name="username"]');
        if (usernameInput) {
          localStorage.setItem('adminName', usernameInput.value);
        }
      });

      // Cek parameter URL untuk pesan error
      const urlParams = new URLSearchParams(window.location.search);
      const failed = urlParams.get('failed');
      
      if (failed === '1') {
        const alertBox = document.getElementById('alertBox');
        alertBox.style.display = 'flex';
        setTimeout(() => {
          alertBox.classList.add('show');
        }, 100);
      }
    });

    function togglePassword() {
      const passwordField = document.getElementById('password');
      const icon = document.querySelector('.toggle-password');
      
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordField.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
  <!-- Test Branch -->

  <script>/* Animasi saat halaman dimuat */
document.addEventListener('DOMContentLoaded', () => {
  document.querySelector('.login-container').classList.add('loaded');
});</script>

</body>
</html>
