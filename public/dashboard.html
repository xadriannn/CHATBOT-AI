<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Dashboard - User Statistics</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f4f7fc;
    color: #333;
  }
  .sidebar {
    position: fixed;
    height: 100vh;
    width: 250px;
    background: #1e293b;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 2rem 1rem;
  }
  .sidebar h2 {
    font-weight: 700;
    margin-bottom: 2rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .nav-link {
    padding: 12px 1rem;
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 500;
    border-radius: 6px;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    transition: background-color 0.3s ease, color 0.3s ease;
    cursor: pointer;
  }
  .nav-link:hover,
  .nav-link.active {
    background-color: #334155;
    color: #f8fafc;
  }
  .nav-link svg {
    margin-right: 10px;
    fill: currentColor;
    width: 18px;
    height: 18px;
  }
  main {
    margin-left: 250px;
    padding: 2rem 3rem;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2.5rem;
  }
  header h1 {
    font-weight: 700;
    font-size: 1.8rem;
    color: #1e293b;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 2rem;
    margin-bottom: 3rem;
  }
  .stat-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgb(149 157 165 / 0.2);
    padding: 1.8rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .stat-card .stat-title {
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 1px;
  }
  .stat-card .stat-value {
    font-size: 2.8rem;
    font-weight: 700;
    color: #2563eb;
    margin-top: 0.3rem;
  }
  .chart-container {
    background: #fff;
    border-radius: 14px;
    padding: 2rem;
    box-shadow: 0 8px 24px rgb(149 157 165 / 0.2);
  }
  footer {
    text-align: center;
    margin-top: 4rem;
    color: #94a3b8;
    font-size: 0.9rem;
  }
  /* Responsive */
  @media (max-width: 768px) {
    .sidebar {
      position: relative;
      width: 100%;
      height: auto;
      flex-direction: row;
      padding: 1rem 2rem;
      justify-content: center;
    }
    .sidebar h2 {
      display: none;
    }
    .nav-link {
      margin: 0 0.8rem;
      padding: 0.5rem 0.8rem;
    }
    main {
      margin: 0;
      padding: 1.5rem 1rem;
    }
    .stats {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1.2rem;
    }
  }
</style>
</head>
<body>
  <nav class="sidebar">
    <h2>Admin Panel</h2>
    <a href="#" class="nav-link active" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-10h-8v10zm0-18v6h8V3h-8z"/></svg>
      Dashboard
    </a>
    <a href="#" class="nav-link">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Users
    </a>
    <a href="#" class="nav-link">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z"/></svg>
      Settings
    </a>
  </nav>
  <main>
    <header>
      <h1>Dashboard</h1>
    </header>

    <section class="stats" aria-label="User statistics">
      <div class="stat-card">
        <div class="stat-title">Total Users</div>
        <div class="stat-value" id="totalUsers">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Active Users</div>
        <div class="stat-value" id="activeUsers">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">New Users (30d)</div>
        <div class="stat-value" id="newUsers">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Churn Rate</div>
        <div class="stat-value" id="churnRate">-</div>
      </div>
    </section>

    <section class="chart-container" aria-label="User registrations over time">
      <canvas id="userChart" width="100%" height="40"></canvas>
    </section>

    <footer>
      &copy; 2024 Admin Dashboard. All rights reserved.
    </footer>
  </main>
  <script src="script.js"></script>
